# One Cloud Build file for every deploy stage (deploy skill, templates/cloudbuild.yaml).
# A Cloud Build trigger runs it on every push to main. A red test stops the deploy.
#
# Order: test || build -> push -> deploy a no-traffic "candidate" revision
# -> send traffic -> smoke test. A failed step leaves the old revision serving.
#
# Bash variables inside args are written $$VAR so Cloud Build leaves them alone.

steps:
  # The image tag: the commit for trigger builds, _TAG for `gcloud builds submit`.
  - id: "image-ref"
    name: "bash"
    args:
      - "-c"
      - |
        TAG="$COMMIT_SHA"; [ -n "$$TAG" ] || TAG="${_TAG}"
        [ -n "$$TAG" ] || { echo "No tag: pass _TAG=<git sha>"; exit 1; }
        echo "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$$TAG" > /workspace/image
        cat /workspace/image

  # Tests run alongside the build.
  - id: "test"
    name: "node:22.23.4-slim"
    waitFor: ["-"]
    entrypoint: bash
    args:
      - "-c"
      - |
        [ "${_RUN_TESTS}" = "true" ] || exit 0
        npm test

  - id: "build"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["image-ref"]
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    args: ["-c", "docker build -t \"$$(cat /workspace/image)\" ."]

  - id: "push"
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["build", "test"]
    entrypoint: bash
    args: ["-c", "docker push \"$$(cat /workspace/image)\""]

  # An existing service gets a no-traffic revision tagged "candidate".
  # The very first deploy creates the service with traffic.
  - id: "deploy"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: bash
    args:
      - "-ceu"
      - |
        FLAGS=(--image="$$(cat /workspace/image)" --region=${_REGION}
          --service-account=${_RUNTIME_SA}
          --memory=${_MEMORY} --cpu=1 --cpu-boost
          --min-instances=${_MIN_INSTANCES} --max-instances=${_MAX_INSTANCES}
          --concurrency=${_CONCURRENCY} --timeout=60
          --startup-probe=httpGet.path=/health,periodSeconds=2,failureThreshold=30
          --quiet)
        if gcloud run services describe ${_SERVICE} --region=${_REGION} >/dev/null 2>&1; then
          gcloud run deploy ${_SERVICE} "$${FLAGS[@]}" --no-traffic --tag=candidate
        else
          gcloud run deploy ${_SERVICE} "$${FLAGS[@]}" --allow-unauthenticated
        fi

  - id: "promote"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: bash
    args:
      - "-ceu"
      - |
        [ "${_PROMOTE}" = "true" ] || { echo "Actions promotes"; exit 0; }
        gcloud run services update-traffic ${_SERVICE} --region=${_REGION} --to-latest
        URL=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')
        bash scripts/smoke.sh "$$URL"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: 900s

substitutions:
  _SERVICE: "clearspeak"
  _REGION: "us-central1"
  _REPO: "clearspeak"                   # Artifact Registry repo
  _RUNTIME_SA: "clearspeak-run@lifebalance-nuxt.iam.gserviceaccount.com"
  _MEMORY: "256Mi"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"
  _CONCURRENCY: "80"
  _RUN_TESTS: "true"
  _PROMOTE: "true"
  _TAG: ""
